name: 'Equall accessibility check'
description: 'Fail a pull request only on the WCAG violations it introduces. Existing debt never blocks.'
author: 'Equall'
branding:
  icon: 'eye'
  color: 'purple'

inputs:
  fail-on:
    description: 'Fail when the change introduces a violation at this severity or above: critical, serious, moderate or minor.'
    required: false
    default: 'critical'
  path:
    description: 'Path to scan, relative to the repository root.'
    required: false
    default: '.'
  base:
    description: 'Git ref to compare against. Defaults to the pull request target branch.'
    required: false
    default: ''
  level:
    description: 'WCAG conformance target: A, AA or AAA.'
    required: false
    default: 'AA'
  version:
    description: 'equall-cli version range to run.'
    required: false
    default: '^0.3.4'
  report-to:
    description: 'Equall ingest URL. When set with project-key, each pull request check is reported to Equall. Empty: nothing leaves the runner.'
    required: false
    default: ''
  project-key:
    description: "The project's key from its settings on Equall. Not a secret: pass it as a repository variable."
    required: false
    default: ''
  comment:
    description: "Comment on the pull request with the issues it introduces: inline on the changed lines, plus one summary kept up to date. Needs `permissions: pull-requests: write`."
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Decide what to run
      id: mode
      shell: bash
      env:
        REPORT_TO: ${{ inputs.report-to }}
        PROJECT_KEY: ${{ inputs.project-key }}
        COMMENT_INPUT: ${{ inputs.comment }}
      run: |
        set -euo pipefail
        report=false
        if [ -n "$REPORT_TO" ] && [ -n "$PROJECT_KEY" ]; then
          report=true
        elif [ -n "$REPORT_TO" ] || [ -n "$PROJECT_KEY" ]; then
          echo "::warning title=Equall::report-to and project-key must both be set to report to Equall. Nothing will be reported."
        fi
        mode=scan
        if [ "$report" = "true" ] && [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
          action=$(node -e 'const e=require(process.env.GITHUB_EVENT_PATH); process.stdout.write(e.action==="edited" ? (e.changes && e.changes.base ? "retargeted" : "edited") : String(e.action||""))')
          case "$action" in
            closed) mode=closed ;;
            # An edit still runs the gate: a skipped run on the same commit would replace a
            # failing check with a green one. Only a change of base branch is reported.
            edited)
              echo "::notice title=Equall::The pull request was edited without changing its base branch: checked, not reported."
              report=false ;;
          esac
        fi
        # Comments only on pull requests that open or move, never on closed or other events.
        comment=false
        if [ "$COMMENT_INPUT" = "true" ] && [ "$mode" = "scan" ] && [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
          pr_action=$(node -e 'const e=require(process.env.GITHUB_EVENT_PATH); process.stdout.write(String(e.action||""))')
          case "$pr_action" in
            opened|synchronize|reopened|ready_for_review) comment=true ;;
          esac
        elif [ "$COMMENT_INPUT" != "true" ] && [ "$COMMENT_INPUT" != "false" ]; then
          echo "::warning title=Equall::comment must be true or false. No comment will be posted."
        fi
        echo "report=$report" >> "$GITHUB_OUTPUT"
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "comment=$comment" >> "$GITHUB_OUTPUT"

    - name: Fetch the history the comparison needs
      if: steps.mode.outputs.mode == 'scan'
      shell: bash
      env:
        BASE_INPUT: ${{ inputs.base }}
      run: |
        set -euo pipefail
        if [ "${GITHUB_EVENT_NAME:-}" = "pull_request_target" ]; then
          echo "::warning title=Equall::pull_request_target checks out the base branch, not the pull request, so there is nothing to compare. Use the pull_request event."
        fi
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --no-tags --prune --unshallow origin
        fi
        if [ -z "$BASE_INPUT" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
          git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
        fi

    - name: Equall
      id: scan
      if: steps.mode.outputs.mode == 'scan'
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        SCAN_PATH: ${{ inputs.path }}
        BASE_INPUT: ${{ inputs.base }}
        LEVEL: ${{ inputs.level }}
        EQUALL_VERSION: ${{ inputs.version }}
        REPORT: ${{ steps.mode.outputs.report }}
        COMMENT: ${{ steps.mode.outputs.comment }}
        EQUALL_REPORT_TO: ${{ inputs.report-to }}
        EQUALL_PROJECT_KEY: ${{ inputs.project-key }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        result="${RUNNER_TEMP}/equall-result.json"
        rm -f "$result" "${RUNNER_TEMP}/equall-pr-url.txt" "${RUNNER_TEMP}/equall-engine-version.txt"
        if { [ "$REPORT" != "true" ] && [ "$COMMENT" != "true" ]; } || [ "${GITHUB_EVENT_NAME:-}" != "pull_request" ]; then
          if [ -n "$BASE_INPUT" ]; then
            npx --yes "equall-cli@${EQUALL_VERSION}" scan "$SCAN_PATH" --level "$LEVEL" --diff "$BASE_INPUT" --fail-on "$FAIL_ON"
          elif [ -n "${GITHUB_BASE_REF:-}" ]; then
            npx --yes "equall-cli@${EQUALL_VERSION}" scan "$SCAN_PATH" --level "$LEVEL" --diff --fail-on "$FAIL_ON"
          else
            echo "::notice title=Equall::Not a pull request: running a report-only scan. The gate applies to pull requests."
            npx --yes "equall-cli@${EQUALL_VERSION}" scan "$SCAN_PATH" --level "$LEVEL"
          fi
          exit 0
        fi
        # Reporting or commenting: pin the exact version once, so the version reported is the
        # one that ran, and keep the JSON result for the steps that follow.
        EQUALL_ENGINE_VERSION=$(env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN npx --yes "equall-cli@${EQUALL_VERSION}" --version)
        export EQUALL_ENGINE_VERSION
        printf '%s' "$EQUALL_ENGINE_VERSION" > "${RUNNER_TEMP}/equall-engine-version.txt"
        set +e
        # ${BASE_INPUT:+...} expands to nothing when no base is given: a bare --diff then
        # compares against the pull request target branch, as above.
        # The scanner gets no way to request identity tokens: only report.mjs needs one.
        env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
          npx --yes "equall-cli@${EQUALL_ENGINE_VERSION}" scan "$SCAN_PATH" --level "$LEVEL" --diff ${BASE_INPUT:+"$BASE_INPUT"} --fail-on "$FAIL_ON" --json-out "$result"
        code=$?
        set -e
        # 2 means the check could not run: there is no result to report.
        if [ "$code" -ne 2 ] && [ "$REPORT" = "true" ]; then
          EQUALL_PR_URL_FILE="${RUNNER_TEMP}/equall-pr-url.txt" node "$ACTION_PATH/report.mjs" check "$result" "$code"
        fi
        exit "$code"

    # Runs after the gate, even when it fails, and never changes the job's result.
    - name: Comment on the pull request
      if: always() && steps.mode.outputs.comment == 'true' && steps.scan.outcome != 'skipped'
      continue-on-error: true
      shell: bash
      env:
        EQUALL_GITHUB_TOKEN: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        result="${RUNNER_TEMP}/equall-result.json"
        if [ ! -f "$result" ]; then
          echo "::notice title=Equall::The check could not run: no comment."
          exit 0
        fi
        EQUALL_ENGINE_VERSION=$(cat "${RUNNER_TEMP}/equall-engine-version.txt" 2>/dev/null || true) \
          EQUALL_PR_URL_FILE="${RUNNER_TEMP}/equall-pr-url.txt" \
          node "$ACTION_PATH/comment.mjs" "$result" || true

    - name: Report the closed pull request
      if: steps.mode.outputs.mode == 'closed'
      shell: bash
      env:
        EQUALL_REPORT_TO: ${{ inputs.report-to }}
        EQUALL_PROJECT_KEY: ${{ inputs.project-key }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/report.mjs" closed
